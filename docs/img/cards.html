<!doctype html>
<meta charset="utf-8">
<title>Bonsai scorecard cards</title>
<!-- Renders one shareable 1200x675 card per ?c= value; bench/render_cards.ps1 screenshots each at 2x into docs/img/. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root {
  --ground: #F3F5F1; --surface: #FFFFFF; --ink: #17211B; --muted: #5E6D63; --line: #DCE2DA; --grid: #E6EBE4;
  --green: #2E7A57; --green-soft: rgba(46,122,87,0.14); --amber: #A86F16; --rust: #B5473A; --band: rgba(181,71,58,0.07);
  --display: "IBM Plex Sans Condensed", "Arial Narrow", Arial, sans-serif;
  --body: "IBM Plex Sans", "Segoe UI", Arial, sans-serif;
  --mono: "IBM Plex Mono", Consolas, monospace;
}
html, body { margin: 0; width: 1200px; height: 675px; overflow: hidden; background: var(--ground); color: var(--ink); font-family: var(--body); }
.card { box-sizing: border-box; width: 1200px; height: 675px; padding: 44px 56px 34px; display: flex; flex-direction: column; gap: 14px; }
.eyebrow { font-family: var(--mono); font-size: 16px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
h1 { margin: 0; font-family: var(--display); font-size: 44px; line-height: 1.08; font-weight: 700; letter-spacing: -0.005em; }
.sub { font-size: 19px; color: var(--muted); margin: 0; max-width: 1000px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 22px; font-size: 16px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 8px; }
.sw { width: 22px; height: 4px; border-radius: 2px; display: inline-block; }
.sw.box { width: 13px; height: 13px; border-radius: 3px; }
.chart { flex: 1; min-height: 0; display: flex; align-items: center; }
.chart svg { width: 100%; height: 100%; }
svg text { font-family: var(--mono); font-size: 14px; fill: var(--muted); }
svg .lbl { fill: var(--ink); font-size: 15px; font-weight: 500; }
svg .cat { font-family: var(--body); font-size: 17px; fill: var(--ink); }
.foot { display: flex; justify-content: space-between; gap: 20px; font-family: var(--mono); font-size: 14px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 12px; }
.foot b { color: var(--ink); font-weight: 500; }
.tiles { flex: 1; display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; align-content: center; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 20px 24px; display: flex; flex-direction: column; gap: 6px; }
.tile .num { font-family: var(--display); font-size: 58px; font-weight: 700; line-height: 1; }
.tile .num small { font-size: 26px; font-weight: 600; color: var(--muted); }
.tile .was { font-family: var(--mono); font-size: 15px; color: var(--muted); }
.tile .was s { color: var(--amber); }
.tile .what { font-size: 18px; }
</style>
<div class="card" id="card"></div>
<script>
var NS = 'http://www.w3.org/2000/svg';
function el(tag, attrs, text) { var e = document.createElementNS(NS, tag); for (var k in attrs) e.setAttribute(k, attrs[k]); if (text !== undefined) e.textContent = text; return e; }
function svg(w, h) { return el('svg', { viewBox: '0 0 ' + w + ' ' + h, preserveAspectRatio: 'xMidYMid meet' }); }
var FOOT = '<div class="foot"><span>RTX 4070 12 GB · Bonsai 2 27B PTQ1_0 + MTP · q8_0 KV · 2026-09-27</span><span><b>github.com/professorpalmer/bonsai-ada-surgery</b></span></div>';
function card(eyebrow, title, sub, legend, body) {
  document.getElementById('card').innerHTML = '<div class="eyebrow">' + eyebrow + '</div><h1>' + title + '</h1>' + (sub ? '<p class="sub">' + sub + '</p>' : '') + (legend || '') + '<div class="chart" id="chart"></div>' + FOOT;
  if (body) document.getElementById('chart').appendChild(body);
}
function legend(items) { return '<div class="legend">' + items.map(function (i) { return '<span><i class="sw' + (i[2] ? ' box' : '') + '" style="background:' + i[0] + '"></i>' + i[1] + '</span>'; }).join('') + '</div>'; }

var cards = {
  summary: function () {
    document.getElementById('card').innerHTML = '<div class="eyebrow">Bonsai 2 27B · RTX 4070 12 GB</div><h1>The full 262,144-token window at q8_0, on a 12 GB card</h1>' +
      '<div class="tiles">' +
      '<div class="tile"><div class="num">262k</div><div class="was">was <s>96k</s> at q8_0</div><div class="what">context window with the q8_0 KV cache</div></div>' +
      '<div class="tile"><div class="num">100 <small>tok/s</small></div><div class="was">was <s>47.6</s></div><div class="what">decode at 32k tokens of context</div></div>' +
      '<div class="tile"><div class="num">161<small>/164</small></div><div class="was">HumanEval, tests executed</div><div class="what">medium reasoning inside the 262k window</div></div>' +
      '<div class="tile"><div class="num">0 → 160</div><div class="was">same server, harness-proofing off → on</div><div class="what">apps that send effort "high" (Cline, Kilo, Open WebUI)</div></div>' +
      '</div>' + FOOT;
  },
  decode: function () {
    var W = 1100, H = 430, L = 60, R = 30, T = 40, B = 44;
    var after = [[4096, 83.0], [16384, 106.2], [32768, 99.8], [65536, 87.1], [112000, 69.6], [131072, 41.2], [180000, 26.9], [258000, 14.7]];
    var before = [[4096, 80], [32768, 47.6], [65536, 36.9]];
    var xmax = 262144, ymax = 120, x = function (v) { return L + v / xmax * (W - L - R); }, y = function (v) { return T + (1 - v / ymax) * (H - T - B); };
    var s = svg(W, H);
    s.appendChild(el('rect', { x: x(112896), y: T, width: x(xmax) - x(112896), height: H - T - B, fill: 'var(--band)' }));
    [0, 20, 40, 60, 80, 100, 120].forEach(function (v) { s.appendChild(el('line', { x1: L, x2: W - R, y1: y(v), y2: y(v), stroke: 'var(--grid)' })); s.appendChild(el('text', { x: L - 10, y: y(v) + 5, 'text-anchor': 'end' }, v)); });
    [0, 50000, 100000, 150000, 200000, 250000].forEach(function (v) { s.appendChild(el('text', { x: x(v), y: H - B + 22, 'text-anchor': 'middle' }, v === 0 ? '0' : (v / 1000) + 'k')); });
    s.appendChild(el('text', { x: L - 10, y: T - 18, 'text-anchor': 'end' }, 'tok/s'));
    [[112896, 'VRAM line 112,896', 'var(--rust)', 0], [98304, 'old window end', 'var(--amber)', 1]].forEach(function (m) {
      s.appendChild(el('line', { x1: x(m[0]), x2: x(m[0]), y1: T, y2: H - B, stroke: m[2], 'stroke-dasharray': '5 5', 'stroke-width': 1.4 }));
      s.appendChild(el('text', { x: x(m[0]) + (m[3] ? -8 : 8), y: T + 16 + m[3] * 18, 'text-anchor': m[3] ? 'end' : 'start' }, m[1]));
    });
    var area = 'M' + x(after[0][0]) + ' ' + y(0) + ' ' + after.map(function (p) { return 'L' + x(p[0]) + ' ' + y(p[1]); }).join(' ') + ' L' + x(after[after.length - 1][0]) + ' ' + y(0) + ' Z';
    s.appendChild(el('path', { d: area, fill: 'var(--green-soft)' }));
    function line(pts, c, w, dash) { var d = pts.map(function (p, i) { return (i ? 'L' : 'M') + x(p[0]) + ' ' + y(p[1]); }).join(' '); var a = { d: d, fill: 'none', stroke: c, 'stroke-width': w, 'stroke-linejoin': 'round' }; if (dash) a['stroke-dasharray'] = dash; s.appendChild(el('path', a)); pts.forEach(function (p) { s.appendChild(el('circle', { cx: x(p[0]), cy: y(p[1]), r: 5, fill: c })); }); }
    line(before, 'var(--amber)', 2.6, '7 5'); line(after, 'var(--green)', 3);
    [[16384, 106.2, 'end', -10, -10], [32768, 99.8, 'start', 8, -11], [65536, 87.1, 'start', 8, -11], [112000, 69.6, 'start', 9, -11], [131072, 41.2, 'start', 9, -10], [180000, 26.9, 'start', 9, -10], [258000, 14.7, 'end', -9, -11]].forEach(function (l) { s.appendChild(el('text', { class: 'lbl', x: x(l[0]) + l[3], y: y(l[1]) + l[4], 'text-anchor': l[2] }, l[1])); });
    [[32768, 47.6], [65536, 36.9]].forEach(function (l) { s.appendChild(el('text', { x: x(l[0]) + 8, y: y(l[1]) + 20, style: 'fill:var(--amber);font-size:15px' }, l[1])); });
    card('Decode speed by context depth', '2x faster at depth, and the window runs to 262k', 'Greedy decode, tokens per second. Past the VRAM line the q8_0 KV tail sits in pinned system RAM, read over PCIe.',
      legend([['var(--green)', 'this bundle: 262k window, q8_0 KV, MTP drafting at every depth'], ['var(--amber)', 'before: 96k window, drafting stopped at 24k']]), s);
  },
  prefill: function () {
    var data = [['4k', 1100], ['16k', 1101], ['32k', 918], ['64k', 724], ['112k', 539], ['131k', 374], ['180k', 298], ['258k', 229]];
    var W = 1100, H = 400, L = 64, R = 20, T = 20, B = 40, ymax = 1200, s = svg(W, H), bw = (W - L - R) / data.length;
    var y = function (v) { return T + (1 - v / ymax) * (H - T - B); };
    [0, 300, 600, 900, 1200].forEach(function (v) { s.appendChild(el('line', { x1: L, x2: W - R, y1: y(v), y2: y(v), stroke: 'var(--grid)' })); s.appendChild(el('text', { x: L - 10, y: y(v) + 5, 'text-anchor': 'end' }, v)); });
    data.forEach(function (d, i) { var cx = L + i * bw + bw / 2, past = i >= 5; s.appendChild(el('rect', { x: L + i * bw + bw * 0.2, y: y(d[1]), width: bw * 0.6, height: y(0) - y(d[1]), rx: 3, fill: past ? 'var(--amber)' : 'var(--green)' })); s.appendChild(el('text', { class: 'lbl', x: cx, y: y(d[1]) - 8, 'text-anchor': 'middle' }, d[1].toLocaleString())); s.appendChild(el('text', { x: cx, y: H - B + 22, 'text-anchor': 'middle' }, d[0])); });
    card('Prefill speed by context depth', 'Prefill across the whole 262k window', 'Tokens per second for each added segment of the prompt. Past the VRAM line the RAM tail is copied into VRAM once per op.',
      legend([['var(--green)', 'KV in VRAM', 1], ['var(--amber)', 'past the VRAM line (tail in system RAM)', 1]]), s);
  },
  kv: function () {
    var rows = [['q4_0 KV', 48, 'var(--rust)', '1 flipped top token in 48 positions', 'KL 0.00218 vs f16'], ['q8_0 KV', 160, 'var(--green)', '1 in 160 positions', 'KL 0.00017 vs f16']];
    var W = 1100, H = 300, L = 130, R = 380, T = 30, rowH = 110, s = svg(W, H);
    s.appendChild(el('text', { x: L, y: 16 }, 'positions per flipped top token, higher is better'));
    rows.forEach(function (r, i) { var yy = T + 24 + i * rowH, w = r[1] / 160 * (W - L - R); s.appendChild(el('text', { class: 'cat', x: L - 14, y: yy + 30, 'text-anchor': 'end' }, r[0])); s.appendChild(el('rect', { x: L, y: yy, width: w, height: 46, rx: 4, fill: r[2] })); s.appendChild(el('text', { class: 'lbl', x: L + w + 12, y: yy + 20 }, r[3])); s.appendChild(el('text', { x: L + w + 12, y: yy + 40 }, r[4])); });
    card('KV cache precision at depth', 'q8_0 flips the top token 3.3x less often than q4_0', 'KL divergence against an f16 KV cache on wikitext-2, scored at 8-16k depth. Every earlier 12 GB recipe used q4_0 to fit 262k.', '', s);
  },
  killy: function () {
    var rows = [['effort "high" (Cline, Kilo, Open WebUI)', 0, 0, 160, 'HTTP 500'], ['256-token cap (PrismML quickstart)', 17, null, 160, ''], ['4096-token cap (Continue)', 137, 148, 157, ''], ['medium, full budget', 161, null, 161, ''], ['thinking off', 148, null, 138, '']];
    var W = 1100, L = 370, R = 70, T = 6, rowH = 70, barH = 15, H = T + rows.length * rowH + 28, s = svg(W, H), max = 164;
    var x = function (v) { return L + v / max * (W - L - R); };
    [0, 41, 82, 123, 164].forEach(function (v) { s.appendChild(el('line', { x1: x(v), x2: x(v), y1: T, y2: H - 26, stroke: 'var(--grid)' })); s.appendChild(el('text', { x: x(v), y: H - 6, 'text-anchor': 'middle' }, v)); });
    rows.forEach(function (r, i) { var y0 = T + i * rowH + 6; s.appendChild(el('text', { class: 'cat', x: L - 16, y: y0 + 29, 'text-anchor': 'end' }, r[0]));
      [[r[1], 'var(--amber)'], [r[2], 'var(--rust)'], [r[3], 'var(--green)']].forEach(function (b, j) { if (b[0] === null) return; var yy = y0 + j * (barH + 4), w = Math.max(b[0] / max * (W - L - R), 3); s.appendChild(el('rect', { x: L, y: yy, width: w, height: barH, rx: 2, fill: b[1] })); s.appendChild(el('text', { class: 'lbl', x: L + w + 8, y: yy + 12.5 }, b[0] === 0 ? '0' + (r[4] ? ' (' + r[4] + (j === 1 ? ', 20 sampled' : '') + ')' : '') : String(b[0]))); }); });
    card('HumanEval 164, tests executed', 'The app decides: 0 or 160. The server now fixes it.', null,
      legend([['var(--amber)', "Killy's plate (PQ2_0, PrismML build)", 1], ['var(--rust)', 'this server, harness-proofing off', 1], ['var(--green)', 'this server, default', 1]]), s);
  },
  igpu: function () {
    var rows = [['desktop VRAM on the 4070 (MiB)', 930, 285, 1000], ['positions in VRAM (thousands)', 95.5, 112.9, 130], ['decode at 131k tokens (tok/s)', 34.3, 41.2, 50]];
    var W = 1100, L = 20, R = 90, T = 8, rowH = 112, H = T + rows.length * rowH, s = svg(W, H);
    rows.forEach(function (r, i) { var y0 = T + i * rowH; s.appendChild(el('text', { class: 'cat', x: L, y: y0 + 18 }, r[0]));
      [[r[1], 'var(--amber)', 'display on the 4070'], [r[2], 'var(--green)', 'display on the iGPU']].forEach(function (b, j) { var yy = y0 + 32 + j * 30, w = b[0] / r[3] * (W - L - R - 220); s.appendChild(el('text', { x: L, y: yy + 16 }, b[2])); s.appendChild(el('rect', { x: L + 220, y: yy, width: w, height: 22, rx: 3, fill: b[1] })); s.appendChild(el('text', { class: 'lbl', x: L + 220 + w + 8, y: yy + 16 }, b[0])); }); });
    card('Display on the CPU’s integrated graphics', '+17.4k positions at full speed, for a cable swap', 'Monitor on the motherboard output, apps forced to the iGPU. We estimated ~30k; Windows keeps ~220 MiB of compositor surfaces on the discrete card.', '', s);
  },
  identity: function () {
    var rows = [['tiered KV vs all-VRAM, draft off', [1, 1, 1]], ['tiered KV vs all-VRAM, draft on', [1, 1, 1]], ['draft on vs off, vector attention', [1, 1, 0]], ['draft on vs off, MMA attention', [0, 1, 0]]];
    var cols = ['4k', '20k', '40k'], W = 1100, L = 420, T = 34, rowH = 70, cw = 170, H = T + rows.length * rowH, s = svg(W, H);
    cols.forEach(function (c, j) { s.appendChild(el('text', { x: L + j * cw + cw / 2, y: 18, 'text-anchor': 'middle', style: 'font-size:16px' }, c + ' tokens')); });
    rows.forEach(function (r, i) { var yy = T + i * rowH; s.appendChild(el('text', { class: 'cat', x: 0, y: yy + 30 }, r[0]));
      r[1].forEach(function (ok, j) { var cx = L + j * cw + 16, w = cw - 32; s.appendChild(el('rect', { x: cx, y: yy + 8, width: w, height: 34, rx: 17, fill: ok ? 'var(--green-soft)' : 'var(--band)', stroke: ok ? 'var(--green)' : 'var(--rust)', 'stroke-width': 1.5 })); s.appendChild(el('text', { class: 'lbl', x: cx + w / 2, y: yy + 30, 'text-anchor': 'middle', style: 'fill:' + (ok ? 'var(--green)' : 'var(--rust)') }, ok ? 'identical' : 'differs')); }); });
    card('Greedy output identity (256-token code and prose continuations)', 'The tiered KV cache is bit-identical to all-VRAM', 'Drafting differs from not drafting at the rounding level, stock kernels included: attention’s KV split follows the batch width.', '', s);
  }
};
cards.pagoda = function () {
  var dir = '../../artifacts/eval/';
  function fig(src, chip, ok, body) {
    return '<figure style="margin:0;display:flex;flex-direction:column;gap:10px;width:330px">' +
      '<img src="' + dir + src + '" alt="" style="width:330px;height:330px;object-fit:cover;border-radius:10px;border:1px solid var(--line);background:#10141f">' +
      '<div style="font-size:16px;line-height:1.35"><span style="font-family:var(--mono);font-size:13px;padding:2px 9px;border-radius:99px;border:1.5px solid ' + (ok ? 'var(--green)' : 'var(--rust)') + ';color:' + (ok ? 'var(--green)' : 'var(--rust)') + '">' + chip + '</span> ' + body + '</div></figure>';
  }
  document.getElementById('card').innerHTML = '<div class="eyebrow">Killy’s plate 037P · voxel pagoda · medium reasoning</div><h1>6 of 6 samples build the pagoda</h1>' +
    '<div style="font-size:19px;color:var(--muted);margin-top:-6px">3 on the first try; a render-check-repair loop fixed the other 3 in one or two rounds</div>' +
    '<div style="flex:1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:28px;align-content:center;justify-items:center">' +
    fig('pagoda_repair_20260927/pagoda_medium_s0_r0.png', 'first try', true, 'temp 1.0 · 630 cubes, none floating') +
    fig('pagoda_t06_20260927/pagoda_medium_s1_r0.png', 'first try', true, 'temp 0.6 · 1,414 cubes, none floating') +
    fig('pagoda_t06_20260927/pagoda_medium_s2_r1.png', '1 repair', true, 'temp 0.6 · import map fixed after one round') +
    '</div>' + FOOT;
};
var c = (location.search.match(/c=(\w+)/) || [])[1] || 'summary';
(cards[c] || cards.summary)();
document.fonts && document.fonts.ready.then(function () { document.body.setAttribute('data-ready', '1'); });
</script>
