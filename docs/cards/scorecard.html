<!doctype html>
<meta charset="utf-8">
<title>Bonsai scorecard</title>
<!-- The main card (README). Every number is in DATA below, each with its source. Edit DATA, then run
     bench/render_cards.ps1. Rendered at 1200 x 675, device scale 2. -->
<script>
var DATA = {
  // Small print under the card, one line per tier.
  rig: {
    '12gb': 'RTX 4070, display on the iGPU: speed 2026-10-19 (bundle-20261019a), HumanEval 2026-10-16 (bundle-20261016)',
    '8gb': 'RTX 2060 SUPER, display on the card: decode 2026-10-16 (bundle-20261016/17), HumanEval 2026-10-14'
  },
  // Window and K/V cache type: start-server.ps1 defaults (12 GB band: q4_0; 8 GB preset: q3_0, 262k with >= 24 GB RAM).
  window: { '12gb': 262144, '8gb': 262144 },
  cache: { '12gb': 'q4_0', '8gb': 'q3_0' },
  // Positions in VRAM: 12 GB docs/research/depth-20261010 D29 (margin 1000, display on the iGPU);
  // 8 GB docs/research/depth-8gb-20261006/experiments/P163.md (launcher line, display on the card).
  vramCells: { '12gb': 260352, '8gb': 80640 },
  // Decode, tok/s, quick_tps mean of code / prose / bash, 400-token greedy answers, MTP + lookup drafting.
  // 12 GB: docs/receipts/depth_table_bundle-20261019a-12gb-fresh.log (2026-10-19, a fresh server for each depth).
  // 8 GB: 4k and 128k P163.md (2026-10-16); 245k P150.md (2026-10-16).
  decode4k: { '12gb': 96.5, '8gb': 53.4 },
  decode128k: { '12gb': 72.0, '8gb': 22.3 },
  decode245k: { '12gb': 60.4, '8gb': 9.8 },
  // Prefill of a fresh 4,048-token code prompt, tok/s. 12 GB the same 2026-10-19 log; 8 GB P163.md sweep 4k.
  prefill4k: { '12gb': 1297, '8gb': 417 },
  // HumanEval 164 at medium, default cache. 12 GB docs/research/release-20261016 U03 (q4_0);
  // 8 GB docs/research/release-20261014b S04 / P131 (q3_0).
  humaneval: { '12gb': 158, '8gb': 163 }
};
</script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<link rel="stylesheet" href="card.css">
<div class="card" id="card"></div>
<script src="card.js"></script>
<script>
(function () {
  var D = DATA;
  function both(f) { var r = {}; ORDER.forEach(function (t) { r[t] = f(t); }); return r; }
  var body = card({
    eyebrow: 'Ternary Bonsai 2 27B · PTQ1_0 · one slot',
    title: 'The full ' + fmt(D.window['12gb'] / 1000) + 'k window on 12 GB and 8 GB cards',
    foot: ORDER.map(function (t) { return D.rig[t]; })
  });
  var heads = both(function (t) { return D.cache[t] + ' K/V cache'; });
  var rows = [
    Object.assign({ label: 'Context window' }, both(function (t) { return { v: fmt(D.window[t]), unit: 'tokens' }; })),
    Object.assign({ label: 'Positions in VRAM' }, both(function (t) { return { v: fmt(D.vramCells[t]), unit: 'of ' + fmt(D.window[t]) }; })),
    Object.assign({ label: 'Decode at 4k', note: 'tok/s' }, both(function (t) { return { v: fmt(D.decode4k[t], 1) }; })),
    Object.assign({ label: 'Decode at 128k', note: 'tok/s' }, both(function (t) { return { v: fmt(D.decode128k[t], 1) }; })),
    Object.assign({ label: 'Decode at 245k', note: 'tok/s' }, both(function (t) { return { v: fmt(D.decode245k[t], 1) }; })),
    Object.assign({ label: 'Read a 4k prompt', note: 'tok/s' }, both(function (t) { return { v: fmt(D.prefill4k[t]) }; })),
    Object.assign({ label: 'HumanEval 164', note: 'medium reasoning' }, both(function (t) { return { v: fmt(D.humaneval[t]), unit: '/ 164' }; }))
  ];
  rows.forEach(function (r) { ORDER.forEach(function (t) { if (r[t] && r[t].v === NM) r[t] = null; }); });
  tierTable(body, rows, heads);
})();
</script>
