<!doctype html><meta charset="utf-8"><title>G5 soak load</title>
<body style="margin:0;background:#000">
<video src="clip.webm" autoplay loop muted playsinline style="width:60vw"></video>
<canvas id="c" width="1280" height="720" style="width:38vw"></canvas>
<script>
// a WebGL shader animation, so the page keeps the GPU busy even if the video decodes on the CPU
const c=document.getElementById('c'), g=c.getContext('webgl');
const vs='attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}';
const fs='precision mediump float;uniform float t;void main(){vec2 u=gl_FragCoord.xy/vec2(1280.,720.);float v=0.;for(int i=0;i<40;i++){v+=sin(u.x*float(i)+t)*cos(u.y*float(i)-t*.7);}gl_FragColor=vec4(.5+.5*sin(v),.5+.5*cos(v*.7),.5+.5*sin(v*1.3),1.);}';
function sh(t,s){const x=g.createShader(t);g.shaderSource(x,s);g.compileShader(x);return x;}
const pr=g.createProgram();g.attachShader(pr,sh(g.VERTEX_SHADER,vs));g.attachShader(pr,sh(g.FRAGMENT_SHADER,fs));g.linkProgram(pr);g.useProgram(pr);
const b=g.createBuffer();g.bindBuffer(g.ARRAY_BUFFER,b);g.bufferData(g.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),g.STATIC_DRAW);
const l=g.getAttribLocation(pr,'p');g.enableVertexAttribArray(l);g.vertexAttribPointer(l,2,g.FLOAT,false,0,0);
const tl=g.getUniformLocation(pr,'t');(function f(ts){g.uniform1f(tl,ts/1000);g.drawArrays(g.TRIANGLE_STRIP,0,4);requestAnimationFrame(f);})(0);
</script>
